<!DOCTYPE html><html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Épületvillamosság 2 – Digitális oktatás</title><link href="style.css" rel="stylesheet"><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#14243a}header{background:#061a30;color:white;padding:25px 40px}nav{background:#082746;padding:14px 40px}nav a{color:white;text-decoration:none;font-weight:bold;margin-right:25px}main{max-width:1120px;margin:auto;padding:35px 20px}.tantargy-fejlec h2{margin-bottom:6px;color:#0e2c50}.week-nav{background:#fff;border:1px solid #dbe5ec;border-radius:12px;padding:18px;margin:18px 0 28px;box-shadow:0 3px 10px rgba(0,0,0,.06)}.week-nav h3{margin:0 0 14px;color:#183a5a}.week-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}.week-grid a{display:block;text-align:center;padding:10px 4px;background:#0e70b7;color:#fff;text-decoration:none;font-weight:800;border-radius:7px}.week-grid a:hover{background:#061a30}.hetek{display:flex;flex-direction:column;gap:12px}.het{position:relative;display:flex;gap:18px;align-items:flex-start;background:#fff;border:1px solid #dbe5ec;border-radius:14px;padding:18px 20px;box-shadow:0 5px 16px rgba(14,44,80,.08);scroll-margin-top:18px}.het.aktualis{padding-top:42px;background:linear-gradient(135deg,#e8f3ff,#f8fbff);border:2px solid #1976d2}.het.aktualis:before{content:'●  AKTUÁLIS HÉT';position:absolute;top:10px;left:88px;padding:5px 12px;border-radius:999px;background:#1976d2;color:#fff;font-size:.78rem;font-weight:800}.het-szam{flex:0 0 62px;width:62px;height:62px;border-radius:14px;background:linear-gradient(135deg,#0d47a1,#2196f3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:900}.het-tartalom{flex:1}.het-tartalom h3{margin:0 0 7px;color:#183a5a}.het-tartalom p{margin:0;color:#617089;line-height:1.45}.gombok{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.gombok a,.gombok .hamarosan{display:inline-block;padding:9px 12px;border-radius:8px;text-decoration:none;font-weight:800;background:#eaf2f8;color:#183a5a}.gombok .feladat-gomb{background:linear-gradient(135deg,#1976d2,#42a5f5);color:#fff}.gombok .gyakorlat-gomb{background:linear-gradient(135deg,#0d47a1,#1e88e5);color:#fff}.gombok .hamarosan{opacity:.45}.iap-kihivas{margin-top:16px;padding:15px 17px;border-radius:13px;background:linear-gradient(135deg,#e3f2fd,#f7fbff);border-left:5px solid #1976d2;color:#183a5a}.iap-kihivas strong{display:block;color:#0d47a1;margin-bottom:7px}.iap-kihivas button{margin-top:10px;border:0;border-radius:8px;padding:8px 12px;background:#1976d2;color:#fff;font-weight:800;cursor:pointer}.iap-kihivas .valasz{display:none;margin-top:10px;padding:10px 12px;border-radius:8px;background:#fff;color:#1b5e20;font-weight:700}.iap-kihivas.nyitott .valasz{display:block}.aktualis-gomb{position:fixed;right:22px;bottom:22px;z-index:9999;display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:999px;background:#0d71b9;color:#fff;text-decoration:none;font-weight:800;box-shadow:0 8px 24px rgba(13,71,161,.3)}footer{margin-top:36px;background:#061a30;color:white;padding:18px 40px;text-align:center}@media(max-width:900px){.week-grid{grid-template-columns:repeat(6,1fr)}}@media(max-width:650px){header,nav{padding-left:20px;padding-right:20px}.week-grid{grid-template-columns:repeat(4,1fr)}.het{gap:12px;padding:15px}.het.aktualis{padding-top:42px}.het.aktualis:before{left:18px}.het-szam{flex-basis:52px;width:52px;height:52px}.gombok a,.gombok .hamarosan{width:100%;text-align:center}.aktualis-gomb{right:12px;bottom:12px}}</style></head><body><header><h1>Épületvillamosság 2</h1><p>IAP – Integrált Automatika Program • Felnőtt oktatás • Digitális oktatás</p></header><nav><a href="index.html">Kezdőlap</a><a href="epuletvillamossag2_felnott.html">← Oktatási forma</a></nav><main><section class="tantargy-fejlec"><h2>Digitális oktatás – 36 hét</h2><p>Heti 5 óra • a jelenléti héttel azonos közös szakmai témára építve</p></section><div class="week-nav"><h3>Válassz hetet!</h3><div class="week-grid" id="weekgrid"></div></div><section><div class="hetek" id="hetek"></div></section></main><footer>© IAP – Integrált Automatika Program • Tanulj! Alkalmazz! Alkoss!</footer><script>const topics={1:'A villamos munka felmérésének gyakorlati és digitális dokumentálása',2:'Anyag- és eszközszükséglet meghatározása, a munka megtervezése',3:'Nyomvonaltervezés és szerelési mód kiválasztása',4:'Szerelvényhelyek, dobozok és kiállások kijelölése',5:'Vezetékek, védőcsövek és kábelcsatornák kiválasztása',6:'Szerelődobozok, kötődobozok és szerelvénydobozok beépítése',7:'Vezetékek behúzása, kábelek elhelyezése és a vezetékezés dokumentálása',8:'Kötések kialakítása, vezetők előkészítése és szerelvények bekötése',9:'Világítási áramkörök és alapkapcsolások kialakítása, dokumentálása',10:'Váltó- és keresztkapcsolások kialakítása, értelmezése és dokumentálása'};const challenges={1:['Egy helyszíni felmérésről digitális dokumentációt készítesz. Melyik négy információ nélkül nem tekintenéd használhatónak a felmérési jegyzőkönyvet?','Helyszín és azonosítás, méretek/nyomvonalak, meglévő és tervezett villamos pontok műszaki adatai, valamint egyértelmű fényképes vagy rajzi dokumentáció.'],2:['Egy 4 × 5 m-es helyiségben 1 kapcsolót, 1 lámpakiállást és 3 dugaljat kell kialakítani. Készíts előzetes anyag- és eszközlistát.','A jó megoldás külön kezeli a darabszámból adódó tételeket, a mért nyomvonalból számított vezeték- és csatornahosszt és a szerelési tartalékot.'],3:['Egy 5 × 4 m-es műhelyhez válassz szerelési módot és rajzolj logikus nyomvonalat.','A megoldás legyen áttekinthető, kerülje a felesleges keresztezéseket, és igazodjon a környezeti és mechanikai igénybevételhez.'],4:['Jelölj ki kapcsolót, lámpakiállást, dugaljakat és kötődobozt egy helyiségben.','Minden elem kapjon egyértelmű azonosítót, és a kijelölések logikusan illeszkedjenek a tervezett nyomvonalhoz.'],5:['Egy 12 m-es nyomvonalra készíts előzetes anyaglistát.','A választást a környezet, mechanikai igénybevétel, terhelés és szerelési mód alapján indokold.'],6:['Egy háromtagú dugaljcsoport középső doboza 4 mm-rel magasabban szerepel a terven. Mit javítanál?','A három doboz tengelyét még kivitelezés előtt közös vízszintes vonalra kell korrigálni.'],7:['Két áramkör részben közös nyomvonalon halad. Készíts jelölési rendszert.','Minden áramkör kapjon egyedi azonosítót, a közös és szétváló szakaszok legyenek visszakövethetők.'],8:['Egy dugalj bekötése után a vezető húzópróbára kicsúszik. Mi a javítási sorrend?','Feszültségmentes állapot, kötés bontása, vezetővég és kapocs ellenőrzése, újrakötés, húzópróba és dokumentálás.'],9:['Egy folyosói lámpát két helyről kell kapcsolni. Készíts jelölési rendszert.','Azonosítsd a betápláló fázist, az összekötő vezetőket, a kapcsolt fázist, valamint az N és PE szerepét.'],10:['Egy lépcsőházi lámpát három helyről kell működtetni, de a középső kapcsoló bizonyos állásokban hibát okoz.','Ellenőrizd a szélső váltókapcsolók közös kapcsait, az összekötő vezetőpárokat és a keresztkapcsoló egyenes/keresztezett kapcsolatait.']};const grid=document.getElementById('weekgrid'),holder=document.getElementById('hetek');for(let i=1;i<=36;i++){const a=document.createElement('a');a.href='#het'+i;a.textContent=i+'. hét';grid.appendChild(a);const d=document.createElement('div');d.className='het';d.id='het'+i;const n=String(i).padStart(2,'0'),title=topics[i]||'Tartalom később kerül feltöltésre.';let buttons='<span class="hamarosan">📖 Tananyag</span><span class="hamarosan">📊 Bemutató</span><span class="hamarosan">✓ Feladat</span><span class="hamarosan">🧪 Gyakorlat</span>';if(i<=10){buttons='<a href="https://zsfazekas65-stack.github.io/IAP/tananyagok/epuletvillamossag2_felnott/digitalis/'+n+'_het.pdf" target="_blank">📖 Tananyag</a><a href="https://zsfazekas65-stack.github.io/IAP/ppt/epuletvillamossag2_felnott/digitalis/'+n+'_het.pptx">📊 Bemutató</a><a class="feladat-gomb" href="https://zsfazekas65-stack.github.io/IAP/feladatok/epuletvillamossag2_felnott/digitalis/feladatok/'+n+'_het_feladat.pdf" target="_blank">✓ Feladat</a><a class="gyakorlat-gomb" href="https://zsfazekas65-stack.github.io/IAP/gyakorlatok/epuletvillamossag2_felnott/digitalis/'+n+'_het_gyakorlat.pdf" target="_blank">🧪 Gyakorlat</a>'}let ch='';if(challenges[i])ch='<div class="iap-kihivas"><strong>⚡ IAP heti kihívás</strong>'+challenges[i][0]+'<br><button type="button" onclick="this.parentElement.classList.toggle(\'nyitott\')">Megoldás mutatása</button><div class="valasz">'+challenges[i][1]+'</div></div>';d.innerHTML='<div class="het-szam">'+n+'</div><div class="het-tartalom"><h3>'+i+'. hét – '+title+'</h3><p>Tananyagegység: Villamos munka felmérése – alapszerelés</p><div class="gombok">'+buttons+'</div>'+ch+'</div>';holder.appendChild(d)}function schoolWeek(d=new Date()){const start=new Date(2026,8,1),end=new Date(2027,5,15);if(d<start)return 1;if(d>end)return 36;const breaks=[[new Date(2026,9,23),new Date(2026,10,1)],[new Date(2026,11,19),new Date(2027,0,3)],[new Date(2027,2,25),new Date(2027,3,4)]];let n=0,cur=new Date(start);while(cur<=d){const day=cur.getDay(),inBreak=breaks.some(([a,b])=>cur>=a&&cur<=b);if(day===1&&!inBreak)n++;cur.setDate(cur.getDate()+1)}return Math.max(1,Math.min(36,n||1))}const w=schoolWeek(),target=document.getElementById('het'+w);if(target)target.classList.add('aktualis');const b=document.createElement('a');b.className='aktualis-gomb';b.href='#het'+w;b.innerHTML='↘ Aktuális hét <strong>'+w+'.</strong>';document.body.appendChild(b);</script></body></html>
