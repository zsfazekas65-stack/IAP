<!DOCTYPE html>
<html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Épületvillamosság 2 – Digitális oktatás</title>
<link href="style.css" rel="stylesheet"><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#14243a}header{background:#061a30;color:white;padding:25px 40px}nav{background:#082746;padding:14px 40px}nav a{color:white;text-decoration:none;font-weight:bold;margin-right:25px}main{max-width:1120px;margin:auto;padding:35px 20px}.tantargy-fejlec h2{margin-bottom:6px;color:#0e2c50}.week-nav{background:#fff;border:1px solid #dbe5ec;border-radius:12px;padding:18px;margin:18px 0 28px;box-shadow:0 3px 10px rgba(0,0,0,.06)}.week-nav h3{margin:0 0 14px;color:#183a5a}.week-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}.week-grid a{display:block;text-align:center;padding:10px 4px;background:#0e70b7;color:#fff;text-decoration:none;font-weight:800;border-radius:7px}.hetek{display:flex;flex-direction:column;gap:12px}.het{position:relative;display:flex;gap:18px;align-items:flex-start;background:#fff;border:1px solid #dbe5ec;border-radius:14px;padding:18px 20px;box-shadow:0 5px 16px rgba(14,44,80,.08);scroll-margin-top:18px}.het-szam{flex:0 0 62px;width:62px;height:62px;border-radius:14px;background:linear-gradient(135deg,#0d47a1,#2196f3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:900;box-shadow:0 5px 14px rgba(25,118,210,.28)}.het-tartalom{flex:1}.het-tartalom h3{margin:0 0 7px;color:#183a5a}.het-tartalom p{margin:0;color:#617089;line-height:1.45}.gombok{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.gombok a,.gombok .hamarosan{display:inline-block;padding:9px 12px;border-radius:8px;text-decoration:none;font-weight:800;background:#eaf2f8;color:#183a5a}.gombok a:hover{background:#183a5a;color:#fff}.gombok .feladat-gomb{background:linear-gradient(135deg,#1976d2,#42a5f5);color:#fff}.gombok .gyakorlat-gomb{background:linear-gradient(135deg,#0d47a1,#1e88e5);color:#fff}.gombok .hamarosan{opacity:.45;cursor:not-allowed}footer{margin-top:36px;background:#061a30;color:white;padding:18px 40px;text-align:center}@media(max-width:900px){.week-grid{grid-template-columns:repeat(6,1fr)}}@media(max-width:650px){header,nav{padding-left:20px;padding-right:20px}.week-grid{grid-template-columns:repeat(4,1fr)}.het{gap:12px;padding:15px}.het-szam{flex-basis:52px;width:52px;height:52px;font-size:1rem}.gombok a,.gombok .hamarosan{width:100%;text-align:center}}
</style></head><body>
<header><h1>Épületvillamosság 2</h1><p>IAP – Integrált Automatika Program • Felnőtt oktatás • Digitális oktatás</p></header>
<nav><a href="index.html">Kezdőlap</a><a href="epuletvillamossag2_felnott.html">← Oktatási forma</a></nav>
<main><section class="tantargy-fejlec"><h2>Digitális oktatás – 36 hét</h2><p>Heti 5 óra • a jelenléti héttel azonos közös szakmai témára építve</p></section>
<div class="week-nav"><h3>Válassz hetet!</h3><div class="week-grid" id="weekgrid"></div></div><section><div class="hetek" id="hetek"></div></section></main>
<footer>© IAP – Integrált Automatika Program • Tanulj! Alkalmazz! Alkoss!</footer>
<script>
const grid=document.getElementById('weekgrid');for(let i=1;i<=36;i++){const a=document.createElement('a');a.href='#het'+i;a.textContent=i+'. hét';grid.appendChild(a)}
const topics={1:'A villamos munka felmérésének gyakorlati és digitális dokumentálása'};const holder=document.getElementById('hetek');
for(let i=1;i<=36;i++){
 const d=document.createElement('div');d.className='het';d.id='het'+i;const num=String(i).padStart(2,'0');const title=topics[i]||'Tartalom később kerül feltöltésre.';const desc='Tananyagegység: Villamos munka felmérése – alapszerelés';
 const buttons=i===1?'<a href="https://zsfazekas65-stack.github.io/IAP/tananyagok/epuletvillamossag2_felnott/digitalis/01_het.pdf" target="_blank">📖 Tananyag</a><a href="https://zsfazekas65-stack.github.io/IAP/ppt/epuletvillamossag2_felnott/digitalis/01_het.pptx">📊 Bemutató</a><a class="feladat-gomb" href="https://zsfazekas65-stack.github.io/IAP/feladatok/epuletvillamossag2_felnott/digitalis/feladatok/01_het_feladat.pdf" target="_blank">✓ Feladat</a><a class="gyakorlat-gomb" href="https://zsfazekas65-stack.github.io/IAP/gyakorlatok/epuletvillamossag2_felnott/digitalis/01_het_gyakorlat.pdf" target="_blank">🧪 Gyakorlat</a>':'<span class="hamarosan">📖 Tananyag</span><span class="hamarosan">📊 Bemutató</span><span class="hamarosan">✓ Feladat</span><span class="hamarosan">🧪 Gyakorlat</span>';
 d.innerHTML='<div class="het-szam">'+num+'</div><div class="het-tartalom"><h3>'+i+'. hét – '+title+'</h3><p>'+desc+'</p><div class="gombok">'+buttons+'</div></div>';holder.appendChild(d);
}
</script></body></html>
