<!DOCTYPE html>
<html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Épületvillamosság 2 – Digitális oktatás</title><link href="style.css" rel="stylesheet"><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#14243a}header{background:#061a30;color:white;padding:25px 40px}nav{background:#082746;padding:14px 40px}nav a{color:white;text-decoration:none;font-weight:bold;margin-right:25px}main{max-width:1120px;margin:auto;padding:35px 20px}.tantargy-fejlec h2{margin-bottom:6px;color:#0e2c50}.week-nav{background:#fff;border:1px solid #dbe5ec;border-radius:12px;padding:18px;margin:18px 0 28px;box-shadow:0 3px 10px rgba(0,0,0,.06)}.week-nav h3{margin:0 0 14px;color:#183a5a}.week-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}.week-grid a{display:block;text-align:center;padding:10px 4px;background:#0e70b7;color:#fff;text-decoration:none;font-weight:800;border-radius:7px}.week-grid a:hover{background:#061a30}.hetek{display:flex;flex-direction:column;gap:12px}.het{display:flex;gap:18px;align-items:flex-start;background:#fff;border:1px solid #dbe5ec;border-radius:14px;padding:18px 20px;box-shadow:0 5px 16px rgba(14,44,80,.08)}.het-szam{flex:0 0 62px;width:62px;height:62px;border-radius:14px;background:linear-gradient(135deg,#0d47a1,#2196f3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:900;box-shadow:0 5px 14px rgba(25,118,210,.28)}.het-tartalom{flex:1}.het-tartalom h3{margin:0 0 7px;color:#183a5a}.het-tartalom p{margin:0;color:#617089}.gombok{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.gombok a,.gombok .hamarosan{display:inline-block;padding:9px 12px;border-radius:8px;text-decoration:none;font-weight:800;background:#eaf2f8;color:#183a5a}.gombok .feladat-gomb{background:linear-gradient(135deg,#1976d2,#42a5f5);color:#fff}.gombok .gyakorlat-gomb{background:linear-gradient(135deg,#0d47a1,#1e88e5);color:#fff}.gombok .hamarosan{opacity:.45}.iap-kihivas{margin-top:16px;padding:15px 17px;border-radius:13px;background:linear-gradient(135deg,#e3f2fd,#f7fbff);border-left:5px solid #1976d2;color:#183a5a}.iap-kihivas strong{display:block;color:#0d47a1;margin-bottom:7px}.iap-kihivas button{margin-top:10px;border:0;border-radius:8px;padding:8px 12px;background:#1976d2;color:#fff;font-weight:800;cursor:pointer}.iap-kihivas .valasz{display:none;margin-top:10px;padding:10px 12px;border-radius:8px;background:#fff;color:#1b5e20;font-weight:700}.iap-kihivas.nyitott .valasz{display:block}footer{margin-top:36px;background:#061a30;color:white;padding:18px 40px;text-align:center}@media(max-width:900px){.week-grid{grid-template-columns:repeat(6,1fr)}}@media(max-width:650px){header,nav{padding-left:20px;padding-right:20px}.week-grid{grid-template-columns:repeat(4,1fr)}.het{gap:12px;padding:15px}.het-szam{flex-basis:52px;width:52px;height:52px}.gombok a,.gombok .hamarosan{width:100%;text-align:center}}
</style></head><body><header><h1>Épületvillamosság 2</h1><p>IAP – Integrált Automatika Program • Felnőtt oktatás • Digitális oktatás</p></header><nav><a href="index.html">Kezdőlap</a><a href="epuletvillamossag2_felnott.html">← Oktatási forma</a></nav><main><section class="tantargy-fejlec"><h2>Digitális oktatás – 36 hét</h2><p>Heti 5 óra • a jelenléti héttel azonos közös szakmai témára építve</p></section><div class="week-nav"><h3>Válassz hetet!</h3><div class="week-grid" id="weekgrid"></div></div><section><div class="hetek" id="hetek"></div></section></main><footer>© IAP – Integrált Automatika Program • Tanulj! Alkalmazz! Alkoss!</footer>
<script>
const grid=document.getElementById('weekgrid');for(let i=1;i<=36;i++){const a=document.createElement('a');a.href='#het'+i;a.textContent=i+'. hét';grid.appendChild(a)}
const topics={1:'A villamos munka felmérésének gyakorlati és digitális dokumentálása',2:'Anyag- és eszközszükséglet meghatározása, a munka megtervezése',3:'Nyomvonaltervezés és szerelési mód kiválasztása',4:'Szerelvényhelyek, dobozok és kiállások kijelölése',5:'Vezetékek, védőcsövek és kábelcsatornák kiválasztása',6:'Szerelődobozok, kötődobozok és szerelvénydobozok beépítése',7:'Vezetékek behúzása, kábelek elhelyezése és a vezetékezés dokumentálása',8:'Kötések kialakítása, vezetők előkészítése és szerelvények bekötése'};
const challenges={1:['Egy helyszíni felmérésről digitális dokumentációt készítesz. Melyik négy információ nélkül nem tekintenéd használhatónak a felmérési jegyzőkönyvet?','Helyszín és azonosítás, méretek/nyomvonalak, meglévő és tervezett villamos pontok műszaki adatai, valamint egyértelmű fényképes vagy rajzi dokumentáció.'],2:['Egy 4 × 5 m-es helyiségben 1 kapcsolót, 1 lámpakiállást és 3 dugaljat kell kialakítani. Készíts legfeljebb 10 tételes előzetes anyag- és eszközlistát. Minden tételnél jelöld, miből származik a mennyiség.','A jó megoldás külön kezeli a darabszámból adódó tételeket, a mért nyomvonalból számított vezeték- és csatornahosszt, a becsült segédanyagokat és az indokolt szerelési tartalékot. A mennyiség forrása minden tételnél visszakövethető.'],3:['Egy 5 × 4 m-es műhelyben az ajtó mellett kapcsoló, a mennyezeten egy lámpa, két szemközti falon összesen 4 dugalj van. Válassz szerelési módot, rajzolj logikus nyomvonalat, majd három mondatban indokold a választásodat.','Műhelyben célszerű lehet a jól hozzáférhető falon kívüli, például kábelcsatornás vagy megfelelően védett kábeles szerelés. A nyomvonal legyen áttekinthető, kerülje a felesleges keresztezéseket, a kötési pontok maradjanak hozzáférhetők. A végleges megoldást mindig a helyiség környezeti és mechanikai igénybevétele alapján kell kiválasztani.'],4:['Egy 4 × 5 m-es helyiségben jelölj ki 1 kapcsolót, 1 lámpakiállást, 4 dugaljat és 1 kötődoboz-helyet. Adj mindegyiknek azonosítót, és írj mellé legalább egy rövid indoklást: miért oda került?','A jó megoldás a kapcsolót a használati logikához, a dugaljakat a várható fogyasztókhoz, a lámpakiállást a világítási funkcióhoz igazítja. A kötődoboz hozzáférhető marad, minden elem egyértelmű azonosítót kap, és a kijelölések logikusan illeszkednek a tervezett nyomvonalhoz.'],5:['Egy terven 12 m-es fő nyomvonalon világítási és dugalj-áramkör halad. Válassz szerelési rendszert, készíts előzetes anyaglistát, és minden döntéshez adj rövid szakmai indokot.','A jó megoldás a környezet és a mechanikai igénybevétel alapján választ védőcsöves, kábelcsatornás vagy indokolt kábeles szerelést. A vezeték vagy kábel végleges keresztmetszetét a terhelés, a túláramvédelem, a szerelési mód, a feszültségesés és a hibavédelmi feltételek ellenőrzése után kell meghatározni. Az anyaglista a nyomvonallal legyen visszakövethető és tartalmazzon indokolt szerelési tartalékot.'],6:['Egy háromtagú dugaljcsoport középső doboza 4 mm-rel magasabban szerepel a terven. Döntsd el, hogyan javítanád még a kivitelezés előtt, és indokold a döntést.','A három doboz tengelyét még kivitelezés előtt közös vízszintes vonalra kell korrigálni. A többes szerelvénykeret megfelelő illeszkedéséhez a dobozok helyzete legyen pontos, mert az eltérés szerelhetőségi és esztétikai hibát okozhat.'],7:['Két áramkör részben közös nyomvonalon halad. Készíts olyan jelölést és áramkör-jegyzéket, amelyből egy másik szerelő tévedés nélkül folytatni tudja a munkát. Ne csak rajzolj: indokold a jelölési rendszeredet is.','A jó megoldás minden áramkörnek egyedi azonosítót ad, egyértelműen megjelöli a közös és a szétváló nyomvonalszakaszokat, valamint rögzíti a funkciót, kezdő- és végpontokat, vezetőket és szükséges megjegyzéseket. A jelölési rendszer akkor megfelelő, ha a tervtől függetlenül is következetesen visszakereshető és egy másik szerelő számára félreérthetetlen.'],8:['Egy dugalj bekötése után a vezető húzópróbára kicsúszik a kapocsból, miközben a csupasz vezetőrészből 3 mm látható a kapocs előtt. Sorolj fel legalább három lehetséges okot, majd írd le a helyes javítási sorrendet.','Lehetséges ok a hibás csupaszítási hossz, a vezető nem teljes bevezetése, a vezető vagy kapocs nem megfelelő párosítása, illetve hibás rögzítés. A javítás során feszültségmentes állapotban bontani és ellenőrizni kell a kötést, szükség esetén újra elő kell készíteni a vezetővéget, a megfelelő kapoccsal újra kialakítani a kötést, majd húzópróbával, szemrevételezéssel és a dokumentáció frissítésével lezárni az ellenőrzést.']};
const holder=document.getElementById('hetek');for(let i=1;i<=36;i++){const d=document.createElement('div');d.className='het';d.id='het'+i;const num=String(i).padStart(2,'0'),title=topics[i]||'Tartalom később kerül feltöltésre.',desc='Tananyagegység: Villamos munka felmérése – alapszerelés';let buttons='<span class="hamarosan">📖 Tananyag</span><span class="hamarosan">📊 Bemutató</span><span class="hamarosan">✓ Feladat</span><span class="hamarosan">🧪 Gyakorlat</span>';
if(i>=1&&i<=8){const w=String(i).padStart(2,'0');buttons='<a href="https://zsfazekas65-stack.github.io/IAP/tananyagok/epuletvillamossag2_felnott/digitalis/'+w+'_het.pdf" target="_blank">📖 Tananyag</a><a href="https://zsfazekas65-stack.github.io/IAP/ppt/epuletvillamossag2_felnott/digitalis/'+w+'_het.pptx">📊 Bemutató</a><a class="feladat-gomb" href="https://zsfazekas65-stack.github.io/IAP/feladatok/epuletvillamossag2_felnott/digitalis/feladatok/'+w+'_het_feladat.pdf" target="_blank">✓ Feladat</a><a class="gyakorlat-gomb" href="https://zsfazekas65-stack.github.io/IAP/gyakorlatok/epuletvillamossag2_felnott/digitalis/'+w+'_het_gyakorlat.pdf" target="_blank">🧪 Gyakorlat</a>'}
let challenge='';if(challenges[i])challenge='<div class="iap-kihivas"><strong>⚡ IAP heti kihívás</strong>'+challenges[i][0]+'<br><button type="button" onclick="this.parentElement.classList.toggle(\'nyitott\');this.textContent=this.parentElement.classList.contains(\'nyitott\')?\'Válasz elrejtése\':\'Megoldás mutatása\'">Megoldás mutatása</button><div class="valasz">'+challenges[i][1]+'</div></div>';d.innerHTML='<div class="het-szam">'+num+'</div><div class="het-tartalom"><h3>'+i+'. hét – '+title+'</h3><p>'+desc+'</p><div class="gombok">'+buttons+'</div>'+challenge+'</div>';holder.appendChild(d)}
</script></body></html>
