<!DOCTYPE html><html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Épületvillamosság 2 – IAP</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#14243a}header{background:#061a30;color:#fff;padding:26px 40px}header h1{margin:0;font-size:32px}header p{margin:7px 0 0;color:#cfe6f5}nav{background:#082746;padding:15px 40px}nav a{color:#fff;text-decoration:none;font-weight:700;margin-right:25px}main{max-width:1100px;margin:auto;padding:46px 25px}.head{text-align:center;margin-bottom:35px}.head h2{font-size:34px;color:#0e2c50;margin-bottom:10px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;max-width:850px;margin:auto}.choice{display:block;background:#fff;border:1px solid #dbe3ea;border-radius:14px;padding:38px 28px;text-decoration:none;color:#14243a;box-shadow:0 8px 20px rgba(20,42,74,.09);transition:.2s;text-align:center}.choice:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(20,42,74,.15);border-color:#20b9f2}.icon{font-size:48px}.choice h3{font-size:25px;color:#0e70b7;margin:15px 0 10px}.choice p{color:#617089;line-height:1.5}.aktualis-par{position:fixed;right:22px;bottom:22px;z-index:9999;display:flex;flex-direction:column;gap:8px}.aktualis-par a{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:999px;background:#0d71b9;color:#fff;text-decoration:none;font-weight:800;box-shadow:0 8px 24px rgba(13,71,161,.3)}.aktualis-par a:hover{filter:brightness(1.08);transform:translateY(-1px)}footer{margin-top:55px;background:#061a30;color:#fff;padding:18px 40px;text-align:center}@media(max-width:700px){.choices{grid-template-columns:1fr}.aktualis-par{right:12px;bottom:12px}.aktualis-par a{padding:11px 14px}}</style></head><body><header><h1>IAP – FELNŐTT OKTATÁS</h1><p>Épületvillamosság 2</p></header><nav><a href="index.html">⌂ Főoldal</a></nav><main><div class="head"><h2>Épületvillamosság 2</h2><p>Válaszd ki az oktatás formáját!</p></div><div class="choices"><a class="choice" href="epuletvillamossag2_felnott_jelenleti.html"><div class="icon">🏫</div><h3>Jelenléti oktatás</h3><p>Az iskolai, személyes foglalkozások 36 hetes tananyaga.</p></a><a class="choice" href="epuletvillamossag2_felnott_digitalis.html"><div class="icon">💻</div><h3>Digitális oktatás</h3><p>Az online/digitális oktatás 36 hetes tananyaga.</p></a></div></main><footer>© IAP – Integrált Automatika Program</footer><script>function schoolWeek(d=new Date()){const start=new Date(2026,8,1),end=new Date(2027,5,15);if(d<start)return 1;if(d>end)return 36;const breaks=[[new Date(2026,9,23),new Date(2026,10,1)],[new Date(2026,11,19),new Date(2027,0,3)],[new Date(2027,2,25),new Date(2027,3,4)]];let n=0,cur=new Date(start);while(cur<=d){const day=cur.getDay(),inBreak=breaks.some(([a,b])=>cur>=a&&cur<=b);if(day===1&&!inBreak)n++;cur.setDate(cur.getDate()+1)}return Math.max(1,Math.min(36,n||1))}const w=schoolWeek();const wrap=document.createElement('div');wrap.className='aktualis-par';wrap.innerHTML='<a href="epuletvillamossag2_felnott_jelenleti.html#het'+w+'">🏫 Jelenléti · '+w+'. hét</a><a href="epuletvillamossag2_felnott_digitalis.html#het'+w+'">💻 Digitális · '+w+'. hét</a>';document.body.appendChild(wrap);</script></body></html>
