<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapcsolat – IAP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .kapcsolat-kartya{max-width:720px;margin:28px auto;padding:28px;text-align:center;}
        .email-cim{font-size:1.05rem;font-weight:700;word-break:break-all;margin:20px 0;}
        .kapcsolat-gombok{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:20px;}
        .masolas-gomb{border:0;cursor:pointer;font:inherit;}
        .visszajelzes{min-height:24px;margin-top:14px;font-weight:700;}
    </style>
</head>
<body>
<header>
    <img src="logo.png" alt="IAP – Integrált Automatika Program" class="iap-logo" style="width:min(450px, 45vw); height:auto; display:block; margin:0 auto;">
</header>
<nav>
    <a href="index.html">Kezdőlap</a>
    <a href="index.html#evfolyamok">Évfolyamok</a>
    <a href="index.html#tantargyak">Tantárgyak</a>
    <a href="kapcsolat.html" aria-current="page">Kapcsolat</a>
</nav>
<main>
    <section class="hero kapcsolat-kartya">
        <h2>Kapcsolat</h2>
        <p>Az IAP – Integrált Automatika Program tananyagportállal kapcsolatos kérdések, észrevételek és hibajelzések.</p>
        <p class="email-cim" id="emailCim">fazekas.zsolt@dunaferriskola.hu</p>
        <div class="kapcsolat-gombok">
            <a href="mailto:fazekas.zsolt@dunaferriskola.hu?subject=IAP%20tananyagport%C3%A1l" class="fo-gomb">✉️ E-mail küldése</a>
            <button type="button" class="fo-gomb masolas-gomb" id="masolasGomb">📋 E-mail cím másolása</button>
        </div>
        <p id="visszajelzes" class="visszajelzes" aria-live="polite"></p>
        <p><a href="index.html" class="fo-gomb">Vissza a kezdőlapra</a></p>
    </section>
</main>
<footer>
    <p>IAP – Integrált Automatika Program</p>
</footer>
<script>
    document.getElementById('masolasGomb').addEventListener('click', async function(){
        const cim = 'fazekas.zsolt@dunaferriskola.hu';
        const visszajelzes = document.getElementById('visszajelzes');
        try {
            await navigator.clipboard.writeText(cim);
            visszajelzes.textContent = 'Az e-mail cím a vágólapra került.';
        } catch (hiba) {
            const mezo = document.createElement('textarea');
            mezo.value = cim;
            document.body.appendChild(mezo);
            mezo.select();
            document.execCommand('copy');
            mezo.remove();
            visszajelzes.textContent = 'Az e-mail cím a vágólapra került.';
        }
    });
</script>
</body>
</html>
