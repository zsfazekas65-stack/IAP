<link href="style.css" rel="stylesheet"><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#14243a}header{background:#061a30;color:white;padding:25px 40px}nav{background:#082746;padding:14px 40px}nav a{color:white;text-decoration:none;font-weight:bold;margin-right:25px}main{max-width:1120px;margin:auto;padding:35px 20px}.tantargy-fejlec h2{margin-bottom:6px;color:#0e2c50}.week-nav{background:#fff;border:1px solid #dbe5ec;border-radius:12px;padding:18px;margin:18px 0 28px;box-shadow:0 3px 10px rgba(0,0,0,.06)}.week-nav h3{margin:0 0 14px;color:#183a5a}.week-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}.week-grid a{display:block;text-align:center;padding:10px 4px;background:#0e70b7;color:#fff;text-decoration:none;font-weight:800;border-radius:7px}.week-grid a:hover{background:#061a30}.hetek{display:flex;flex-direction:column;gap:12px}.het{display:flex;gap:18px;align-items:flex-start;background:#fff;border:1px solid #dbe5ec;border-radius:14px;padding:18px 20px;box-shadow:0 5px 16px rgba(14,44,80,.08);scroll-margin-top:18px}.het-szam{flex:0 0 62px;width:62px;height:62px;border-radius:14px;background:linear-gradient(135deg,#0d47a1,#2196f3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:900;box-shadow:0 5px 14px rgba(25,118,210,.28)}.het-tartalom{flex:1}.het-tartalom h3{margin:0 0 7px;color:#183a5a}.het-tartalom p{margin:0;color:#617089;line-height:1.45}.gombok{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.gombok a,.gombok .hamarosan{display:inline-block;padding:9px 12px;border-radius:8px;text-decoration:none;font-weight:800;background:#eaf2f8;color:#183a5a}.gombok a:hover{background:#183a5a;color:#fff}.gombok .feladat-gomb{background:linear-gradient(135deg,#1976d2,#42a5f5);color:#fff}.gombok .gyakorlat-gomb{background:linear-gradient(135deg,#0d47a1,#1e88e5);color:#fff}.gombok .hamarosan{opacity:.45}.iap-kihivas{margin-top:16px;padding:15px 17px;border-radius:13px;background:linear-gradient(135deg,#e3f2fd,#f7fbff);border-left:5px solid #1976d2;color:#183a5a}.iap-kihivas strong{display:block;color:#0d47a1;margin-bottom:7px}.iap-kihivas button{margin-top:10px;border:0;border-radius:8px;padding:8px 12px;background:#1976d2;color:#fff;font-weight:800;cursor:pointer}.iap-kihivas .valasz{display:none;margin-top:10px;padding:10px 12px;border-radius:8px;background:#fff;color:#1b5e20;font-weight:700}.iap-kihivas.nyitott .valasz{display:block}footer{margin-top:36px;background:#061a30;color:white;padding:18px 40px;text-align:center}@media(max-width:900px){.week-grid{grid-template-columns:repeat(6,1fr)}}@media(max-width:650px){header,nav{padding-left:20px;padding-right:20px}.week-grid{grid-template-columns:repeat(4,1fr)}.het{gap:12px;padding:15px}.het-szam{flex-basis:52px;width:52px;height:52px}.gombok a,.gombok .hamarosan{width:100%;text-align:center}}
</style></head><body><header><h1>Épületvillamosság 2</h1><p>IAP – Integrált Automatika Program • Felnőtt oktatás • Jelenléti oktatás</p></header><nav><a href="index.html">Kezdőlap</a><a href="epuletvillamossag2_felnott.html">← Oktatási forma</a></nav><main><section class="tantargy-fejlec"><h2>Jelenléti oktatás – 36 hét</h2><p>Heti 5 óra • közös 10 órás heti téma digitális párjával</p></section><div class="week-nav"><h3>Válassz hetet!</h3><div class="week-grid" id="weekgrid"></div></div><section><div class="hetek" id="hetek"></div></section></main><footer>© IAP – Integrált Automatika Program • Tanulj! Alkalmazz! Alkoss!</footer>
<script>
const grid=document.getElementById('weekgrid');for(let i=1;i<=36;i++){const a=document.createElement('a');a.href='#het'+i;a.textContent=i+'. hét';grid.appendChild(a)}
const topics={1:'A villamos munka felmérésének alapjai',2:'Anyag- és eszközszükséglet meghatározása, a munka megtervezése',3:'Nyomvonaltervezés és szerelési mód kiválasztása',4:'Szerelvényhelyek, dobozok és kiállások kijelölése'};
const challenges={1:['Egy lakás egyik helyiségében új világítási áramkört kell kialakítani. Mi az első három dolog, amit a helyszíni felméréskor rögzítenél?','A meglévő hálózat és nyomvonal állapota, a tervezett fogyasztók és szerelvények helye, valamint a szükséges méretek és műszaki adottságok.'],2:['Egy helyiségben 6 dugaljat és 2 világítási pontot kell kiépíteni. Milyen fő anyagcsoportokat vennél fel az anyagjegyzékbe?','Vezetékek/kábelek, védőcsövek vagy csatornák, kötő- és szerelvénydobozok, dugaljak és kapcsolók, világítási szerelvények, rögzítőanyagok és szükséges védelmi készülékek.'],3:['Egy 5 × 4 m-es műhelyben 1 kapcsoló, 1 mennyezeti lámpa és 4 dugalj készül. Válassz szerelési módot, jelöld ki a nyomvonalat, mérd meg a fő szakaszokat, majd három szakmai érvvel védd meg a választott megoldást.','A jó megoldás a műhely környezeti és mechanikai igénybevételéhez illő szerelési módot választ, áttekinthető vízszintes és függőleges nyomvonalat alkalmaz, a leágazásokat és kötési pontokat hozzáférhetően alakítja ki, a mért szakaszhosszakat pedig dokumentálja és az anyagigénnyel összekapcsolja.'],4:['Egy 4 × 5 m-es helyiségben jelölj ki 1 kapcsolót, 1 lámpakiállást, 4 dugaljat és 1 kötődobozt. Minden elem kapjon azonosítót. Minden kijelölésnél mondj legalább egy szakmai indokot: miért oda került?','A jó megoldás a kapcsolót a használati logikához, a dugaljakat a várható fogyasztókhoz, a lámpakiállást a világítási funkcióhoz igazítja. A kötődoboz hozzáférhető marad, minden elem azonosított, méretezhető és logikusan csatlakozik a nyomvonalhoz.']};
const holder=document.getElementById('hetek');for(let i=1;i<=36;i++){const d=document.createElement('div');d.className='het';d.id='het'+i;const num=String(i).padStart(2,'0'),title=topics[i]||'Tartalom később kerül feltöltésre.',desc='Tananyagegység: Villamos munka felmérése – alapszerelés';let buttons='<span class="hamarosan">📖 Tananyag</span><span class="hamarosan">📊 Bemutató</span><span class="hamarosan">✓ Feladat</span><span class="hamarosan">🧪 Gyakorlat</span>';if(i===1)buttons='<a href="https://zsfazekas65-stack.github.io/IAP/tananyagok/epuletvillamossag2_felnott/jelenleti/01_het.pdf" target="_blank">📖 Tananyag</a><a href="https://zsfazekas65-stack.github.io/IAP/ppt/epuletvillamossag2_felnott/jelenleti/01_het.pptx">📊 Bemutató</a><a class="feladat-gomb" href="https://zsfazekas65-stack.github.io/IAP/feladatok/epuletvillamossag2_felnott/jelenleti/feladatok/01_het_feladat.pdf" target="_blank">✓ Feladat</a><a class="gyakorlat-gomb" href="https://zsfazekas65-stack.github.io/IAP/gyakorlatok/epuletvillamossag2_felnott/jelenleti/01_het_gyakorlat.pdf" target="_blank">🧪 Gyakorlat</a>';if(i===2)buttons='<a href="https://zsfazekas65-stack.github.io/IAP/tananyagok/epuletvillamossag2_felnott/jelenleti/02_het.pdf" target="_blank">📖 Tananyag</a><a href="https://zsfazekas65-stack.github.io/IAP/ppt/epuletvillamossag2_felnott/jelenleti/02_het.pptx">📊 Bemutató</a><a class="feladat-gomb" href="https://zsfazekas65-stack.github.io/IAP/feladatok/epuletvillamossag2_felnott/jelenleti/feladatok/02_het_feladat.pdf" target="_blank">✓ Feladat</a><a class="gyakorlat-gomb" href="https://zsfazekas65-stack.github.io/IAP/gyakorlatok/epuletvillamossag2_felnott/jelenleti/02_het_gyakorlat.pdf" target="_blank">🧪 Gyakorlat</a>';if(i===3)buttons='<a href="https://zsfazekas65-stack.github.io/IAP/tananyagok/epuletvillamossag2_felnott/jelenleti/03_het.pdf" target="_blank">📖 Tananyag</a><a href="https://zsfazekas65-stack.github.io/IAP/ppt/epuletvillamossag2_felnott/jelenleti/03_het.pptx">📊 Bemutató</a><a class="feladat-gomb" href="https://zsfazekas65-stack.github.io/IAP/feladatok/epuletvillamossag2_felnott/jelenleti/feladatok/03_het_feladat.pdf" target="_blank">✓ Feladat</a><a class="gyakorlat-gomb" href="https://zsfazekas65-stack.github.io/IAP/gyakorlatok/epuletvillamossag2_felnott/jelenleti/03_het_gyakorlat.pdf" target="_blank">🧪 Gyakorlat</a>';if(i===4)buttons='<a href="https://zsfazekas65-stack.github.io/IAP/tananyagok/epuletvillamossag2_felnott/jelenleti/04_het.pdf" target="_blank">📖 Tananyag</a><span class="hamarosan">📊 Bemutató</span><a class="feladat-gomb" href="https://zsfazekas65-stack.github.io/IAP/feladatok/epuletvillamossag2_felnott/jelenleti/feladatok/04_het_feladat.pdf" target="_blank">✓ Feladat</a><a class="gyakorlat-gomb" href="https://zsfazekas65-stack.github.io/IAP/gyakorlatok/epuletvillamossag2_felnott/jelenleti/04_het_gyakorlat.pdf" target="_blank">🧪 Gyakorlat</a>';let challenge='';if(challenges[i])challenge='<div class="iap-kihivas"><strong>⚡ IAP heti kihívás</strong>'+challenges[i][0]+'<br><button type="button" onclick="this.parentElement.classList.toggle(\'nyitott\');this.textContent=this.parentElement.classList.contains(\'nyitott\')?\'Válasz elrejtése\':\'Megoldás mutatása\'">Megoldás mutatása</button><div class="valasz">'+challenges[i][1]+'</div></div>';d.innerHTML='<div class="het-szam">'+num+'</div><div class="het-tartalom"><h3>'+i+'. hét – '+title+'</h3><p>'+desc+'</p><div class="gombok">'+buttons+'</div>'+challenge+'</div>';holder.appendChild(d)}
</script></body></html>
