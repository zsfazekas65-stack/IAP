name: VS11 week 21
on:
  push:
    paths:
      - '.github/workflows/vs11-week21-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate week 21
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('iap-naptar.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const keszHet=20;','const keszHet=21;')
          needle="    20:{cim:'Lépcsőházi automata és impulzusrelé',leiras:'58–60. óra: több kezelési hely nyomógombokkal, időzített világításvezérlés és impulzusrelés állapotváltás.'}"
          repl=needle+",\n    21:{cim:'Ipari szerelvények és kapcsolókészülékek',leiras:'61–63. óra: ipari kapcsoló-, vezérlő-, védelmi, jelző- és csatlakozókészülékek felismerése, kiválasztása, kapocsazonosítása és DIN-sínes szerelési alapjai.'}"
          if '21:{cim:' not in s:
              s=s.replace(needle,repl)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'IAP automation'
          git config user.email 'actions@users.noreply.github.com'
          git add iap-naptar.js
          git diff --cached --quiet || git commit -m 'Villamos szerelések 11 – 21. hét aktiválása'
          git push
