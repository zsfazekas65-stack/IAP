name: IAP status link

on:
  push:
    paths:
      - '.github/workflows/iap-calendar-bind.yml'

permissions:
  contents: write

jobs:
  add-status-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add status link to homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="links"><a href="kapcsolat.html">KAPCSOLAT</a><a href="moodle.html">MOODLE</a></div>'
          new='<div class="links"><a href="kapcsolat.html">KAPCSOLAT</a><a href="statusz.html">IAP STÁTUSZ</a><a href="moodle.html">MOODLE</a></div>'
          if old in s:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          elif 'href="statusz.html"' not in s:
              raise RuntimeError('A főoldali linkhely nem található.')
          PY
      - name: Commit homepage change
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'IAP automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Add IAP status link to homepage'
          git push
