name: Add Villamos10 weekly challenges
on:
  push:
    paths: ['.github/workflows/add-villamos10-kihivas.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build challenges from actual Villamos10 weekly topics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          html=Path('villamos10.html').read_text(encoding='utf-8')
          cards=re.findall(r'<div class="het[^\"]*">\s*<div class="het-szam">(\d+)</div>\s*<div class="het-tartalom">\s*<h3>(.*?)</h3>\s*<p>(.*?)</p>',html,re.S)
          topics={w:(re.sub('<.*?>','',t).strip(),re.sub('<.*?>','',d).strip()) for w,t,d in cards}
          if len(topics)!=36: raise SystemExit(f'Expected 36 weeks, found {len(topics)}')
          templates=[
            ('Szakmai felismerés','Melyik állítás kapcsolódik legjobban ehhez a heti témához: „{title}”?'),
            ('Szakmai döntés','A „{title}” témakörben melyik gondolkodásmód a legszakmaibb?'),
            ('Mérés és ellenőrzés','A „{title}” gyakorlati vizsgálatánál melyik elv a legfontosabb?'),
            ('Hibakereső','A „{title}” témához kapcsolódó hibánál mi legyen az első tudatos lépés?')]
          data={}
          for i in range(1,37):
            w=f'{i:02d}'; title,desc=topics[w]; typ,qtpl=templates[(i-1)%len(templates)]
            if typ=='Szakmai felismerés':
              answers=[desc,'A mérés és dokumentálás minden esetben felesleges.','A biztonsági szabályok csak elméleti jelentőségűek.','A kapcsolás működését találgatással kell eldönteni.']; correct=0; exp=f'A heti tananyag lényege: {desc}'
            elif typ=='Szakmai döntés':
              answers=['A feladat értelmezése, az összefüggések alkalmazása és az eredmény ellenőrzése.','Az első alkatrész találomra történő cseréje.','A mérési eredmények figyelmen kívül hagyása.','A biztonsági ellenőrzés kihagyása időnyerés céljából.']; correct=0; exp='A szakmai munka tudatos: értelmezzük a feladatot, alkalmazzuk a tanult összefüggéseket, majd ellenőrizzük az eredményt.'
            elif typ=='Mérés és ellenőrzés':
              answers=['A megfelelő mérési mód és méréshatár kiválasztása, szabályos bekötés, majd az eredmény értelmezése.','Mindig a legnagyobb áramot kell közvetlenül megmérni.','A műszer bekötése nem függ a mérendő mennyiségtől.','A számított és mért értéket nem érdemes összehasonlítani.']; correct=0; exp='A jó méréshez megfelelő műszerbeállítás, szabályos bekötés és az eredmény szakmai értelmezése szükséges.'
            else:
              answers=['Megfigyelés és biztonsági ellenőrzés után mérésekkel szűkíteni a hiba helyét.','Az összes alkatrészt egyszerre kicserélni.','A tápfeszültséget találomra növelni.','Mérés nélkül eldönteni, melyik elem hibás.']; correct=0; exp='A hibakeresés logikus folyamat: megfigyelés, biztonság, mérés, következtetés és ellenőrzés.'
            data[w]={'tipus':typ,'kerdes':qtpl.format(title=title),'valaszok':answers,'helyes':correct,'magyarazat':exp}
          # Hand-crafted calculation/technical challenges for core weeks where topic is identifiable.
          def setq(w,typ,q,a,c,e): data[w]={'tipus':typ,'kerdes':q,'valaszok':a,'helyes':c,'magyarazat':e}
          setq('03','Számolj!','2 másodperc alatt 10 C töltés halad át egy vezető keresztmetszetén. Mekkora az áramerősség?',['5 A','10 A','20 A','0,2 A'],0,'I = Q/t = 10 C / 2 s = 5 A.')
          setq('04','Mérés','Hogyan kapcsoljuk a voltmérőt a vizsgált fogyasztóhoz?',['Párhuzamosan','Sorosan','Rövidzárként','Csak a védővezetőbe'],0,'A feszültség két pont közötti potenciálkülönbség, ezért a voltmérőt párhuzamosan kapcsoljuk.')
          setq('05','Ohm törvénye','12 V feszültség mellett 4 A folyik. Mekkora az ellenállás?',['3 Ω','8 Ω','16 Ω','48 Ω'],0,'R = U/I = 12/4 = 3 Ω.')
          setq('06','Számolj!','Egy 100 Ω-os ellenállásra 10 V jut. Mekkora az áram?',['0,1 A','1 A','10 A','1000 A'],0,'I = U/R = 10/100 = 0,1 A.')
          setq('07','Soros kapcsolás','100 Ω és 220 Ω sorba kapcsolva. Mekkora az eredő?',['320 Ω','120 Ω','2,2 Ω','22 kΩ'],0,'Soros kapcsolásnál az ellenállások összeadódnak: 100 + 220 = 320 Ω.')
          setq('08','Párhuzamos kapcsolás','Két azonos, 100 Ω-os ellenállás párhuzamos eredője mennyi?',['50 Ω','100 Ω','200 Ω','10 kΩ'],0,'Két azonos ellenállás párhuzamos eredője az egyik érték fele: 50 Ω.')
          setq('09','Kirchhoff','Egy csomópontba 5 A érkezik, két ágon 2 A és 1 A távozik. Mennyi távozik a harmadik ágon?',['2 A','3 A','5 A','8 A'],0,'Kirchhoff csomóponti törvénye szerint a befolyó és kifolyó áramok összege azonos: 5−2−1=2 A.')
          setq('10','Kirchhoff','Egy zárt hurokban 12 V forrás mellett az egyik fogyasztón 5 V esik. Mennyi jut a másikra, ha csak két fogyasztó van?',['7 V','17 V','5 V','2,4 V'],0,'A hurok feszültségeséseinek összege a forrásfeszültség: 12−5=7 V.')
          # Generate JS with same UI behavior as Villamos9 but separate storage namespace.
          obj=json.dumps(data,ensure_ascii=False,separators=(',',':'))
          js=f'''(()=>{{\nconst KIHIVASOK={obj};\nconst CSS=`.iap-kihivas{{margin-top:14px;border:1px solid #b7dcf4;border-radius:14px;background:linear-gradient(135deg,#f7fbff,#eef8ff);overflow:hidden;box-shadow:0 7px 20px rgba(13,71,161,.08)}}.iap-kihivas-fej{{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(135deg,#0d47a1,#1976d2);color:#fff}}.iap-kihivas-fej b{{font-size:14px;letter-spacing:.04em}}.iap-kihivas-fej span{{margin-left:auto;font-size:12px;opacity:.9}}.iap-kihivas-belso{{padding:14px}}.iap-kihivas-kerdes{{font-weight:800;line-height:1.45;color:#12304e;margin-bottom:11px}}.iap-kihivas-valaszok{{display:grid;gap:8px}}.iap-kihivas-valasz{{border:1px solid #cbddeb;background:#fff;border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;color:#183a59;font-weight:600;transition:.15s}}.iap-kihivas-valasz:hover{{border-color:#1976d2;transform:translateY(-1px)}}.iap-kihivas-valasz.helyes{{background:#e8f7ee;border-color:#2e9b58;color:#176b36}}.iap-kihivas-valasz.hibas{{background:#fff0ef;border-color:#cf5a50;color:#8e2d27}}.iap-kihivas-vissza{{display:none;margin-top:11px;padding:11px 12px;border-radius:10px;line-height:1.45;font-size:14px}}.iap-kihivas-vissza.show{{display:block}}.iap-kihivas-vissza.ok{{background:#e8f7ee;color:#176b36}}.iap-kihivas-vissza.bad{{background:#fff5e8;color:#8a5a00}}.iap-kihivas-pont{{margin-top:9px;font-size:12px;color:#5d7186;font-weight:700}}`;\nfunction init(){{let s=document.createElement('style');s.textContent=CSS;document.head.appendChild(s);document.querySelectorAll('.het').forEach(card=>{{let m=(card.querySelector('.het-szam')?.textContent||'').match(/\\d+/);if(!m)return;let w=String(parseInt(m[0])).padStart(2,'0'),k=KIHIVASOK[w];if(!k)return;let wrap=document.createElement('div');wrap.className='iap-kihivas';wrap.innerHTML=`<div class="iap-kihivas-fej"><b>⚡ IAP HETI KIHÍVÁS</b><span>${{k.tipus}}</span></div><div class="iap-kihivas-belso"><div class="iap-kihivas-kerdes">${{k.kerdes}}</div><div class="iap-kihivas-valaszok"></div><div class="iap-kihivas-vissza"></div><div class="iap-kihivas-pont"></div></div>`;let box=wrap.querySelector('.iap-kihivas-valaszok'),fb=wrap.querySelector('.iap-kihivas-vissza'),pt=wrap.querySelector('.iap-kihivas-pont'),key='iap-kihivas-villamos10-'+w;function answer(i){{[...box.children].forEach(x=>x.disabled=true);let ok=i===k.helyes;box.children[k.helyes].classList.add('helyes');if(!ok)box.children[i].classList.add('hibas');fb.className='iap-kihivas-vissza show '+(ok?'ok':'bad');fb.innerHTML=(ok?'✅ <strong>Helyes.</strong> ':'💡 <strong>Még nem.</strong> ')+k.magyarazat;localStorage.setItem(key,ok?'1':'0');pt.textContent=ok?'Teljesítve ✓':'Próbáld újra később – a gondolkodás a lényeg.'}}k.valaszok.forEach((t,i)=>{{let b=document.createElement('button');b.type='button';b.className='iap-kihivas-valasz';b.textContent=String.fromCharCode(65+i)+') '+t;b.onclick=()=>answer(i);box.appendChild(b)}});if(localStorage.getItem(key)==='1')answer(k.helyes);card.querySelector('.het-tartalom')?.appendChild(wrap)}})}}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();\n}})();'''
          Path('iap-kihivas-villamos10.js').write_text(js,encoding='utf-8')
          tag='<script src="iap-kihivas-villamos10.js"></script>'
          if tag not in html:
            html=html.replace('</body>',tag+'</body>')
            Path('villamos10.html').write_text(html,encoding='utf-8')
          print('Created 36 challenges from actual Villamos10 week cards')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add villamos10.html iap-kihivas-villamos10.js
          git commit -m 'Add all 36 weekly challenges to Villamos10'
          git push
