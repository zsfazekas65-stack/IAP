name: PLC fájlnevek rendezése

on:
  push:
    paths:
      - '.github/workflows/plc-nevrendezes.yml'

permissions:
  contents: write

jobs:
  rename-plc-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PLC fájlok egységes átnevezése és hivatkozások javítása
        shell: bash
        run: |
          set -euo pipefail

          for n in $(seq -w 1 36); do
            src="feladatok/plc/${n}_het.pdf"
            dst="feladatok/plc/${n}_het_feladat.pdf"
            if [ -f "$src" ]; then
              if [ -e "$dst" ]; then
                echo "Célfájl már létezik: $dst" >&2
                exit 1
              fi
              git mv "$src" "$dst"
            fi

            src="gyakorlatok/plc/${n}_het.pdf"
            dst="gyakorlatok/plc/${n}_het_gyakorlat.pdf"
            if [ -f "$src" ]; then
              if [ -e "$dst" ]; then
                echo "Célfájl már létezik: $dst" >&2
                exit 1
              fi
              git mv "$src" "$dst"
            fi
          done

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('plc.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'feladatok/plc/(\d{2}_het)\.pdf', r'feladatok/plc/\1_feladat.pdf', s)
          s = re.sub(r'gyakorlatok/plc/(\d{2}_het)\.pdf', r'gyakorlatok/plc/\1_gyakorlat.pdf', s)
          p.write_text(s, encoding='utf-8')
          PY

          test "$(find feladatok/plc -maxdepth 1 -type f -name '*_het_feladat.pdf' | wc -l)" -eq 36
          test "$(find gyakorlatok/plc -maxdepth 1 -type f -name '*_het_gyakorlat.pdf' | wc -l)" -eq 36
          ! grep -Eq 'feladatok/plc/[0-9]{2}_het\.pdf' plc.html
          ! grep -Eq 'gyakorlatok/plc/[0-9]{2}_het\.pdf' plc.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plc.html feladatok/plc gyakorlatok/plc
          git commit -m "Normalize PLC assignment and practical file names"
          git push
