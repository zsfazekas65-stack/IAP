name: IAP index layout fix
on:
  push:
    paths:
      - '.iap-patch/index-layout.trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix homepage layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* IAP HOMEPAGE LAYOUT FIX 2026-09-08 */'
          css='''\n<style>\n/* IAP HOMEPAGE LAYOUT FIX 2026-09-08 */\nhtml,body{max-width:100%;overflow-x:hidden}\n.nav-inner{padding-left:24px;padding-right:24px}\n.nav-inner>a,.nav-drop button,.nav-disabled{font-size:15px;padding-left:16px;padding-right:16px}\n.nav-inner>a:first-child{margin-right:10px}\n.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}\n.card{min-width:0}\n.card h3{white-space:normal!important;overflow-wrap:anywhere!important;line-height:1.15}\n.subject-btn{white-space:normal;line-height:1.25}\n@media(max-width:1050px){.nav-inner{overflow-x:auto}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:760px){.cards{grid-template-columns:1fr}}\n</style>\n'''
          if marker not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Főoldal: tartalom és navigáció elrendezés javítása' || exit 0
          git pull --rebase origin main
          git push origin main
