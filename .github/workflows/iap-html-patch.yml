name: IAP HTML patch

on:
  push:
    paths:
      - '.iap-patch/**'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Villamos szerelések 11 week 31 structure
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('villamosszereles11.html')
          s = p.read_text(encoding='utf-8')

          # Töröljük az esetlegesen bekerült vezérlőkaraktereket.
          s = ''.join(ch for ch in s if ch in '\n\r\t' or ord(ch) >= 32)

          week31 = '<div class="het"><div class="het-szam">31</div><div class="het-tartalom"><h3>31. hét – Hibakeresési módszerek</h3><p>Tünet és hibaok megkülönböztetése, rajz alapú áramút-követés, szakaszolásos és felezéses hibakeresés, mérési pontok kijelölése, következtetés és dokumentálás.</p><div class="gombok"><a href="tananyagok/villamosszereles11/31_het.pdf" target="_blank">📖 Tananyag</a><a href="ppt/villamosszereles11/31_het.pptx" download>📊 Bemutató</a><a class="feladat-gomb" href="feladatok/villamosszereles11/31_het_feladat.pdf" target="_blank">✓ Feladat</a><a class="gyakorlat-gomb" href="gyakorlatok/villamosszereles11/31_het_gyakorlat.pdf" target="_blank">🧪 Gyakorlat</a></div></div></div>'

          start = s.find('<div class="het"><div class="het-szam">31</div>')
          next_week = s.find('<div class="het"><div class="het-szam">32</div>', start)
          if start == -1 or next_week == -1:
              raise SystemExit('31/32. heti blokk nem található')

          s = s[:start] + week31 + s[next_week:]
          s = s.replace('iap-naptar.js?v=30', 'iap-naptar.js?v=31')
          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "iap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add villamosszereles11.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Villamos szerelések 11: 31. heti megjelenítés javítása"
            git push
          fi
