<!DOCTYPE html><html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>IAP – Felnőtt oktatás – Villamos berendezések</title><link href="style.css" rel="stylesheet"><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#14243a}header{background:#061a30;color:white;padding:25px 40px}nav{background:#082746;padding:14px 40px}nav a{color:white;text-decoration:none;font-weight:bold;margin-right:25px}main{max-width:1120px;margin:auto;padding:35px 20px}.tantargy-fejlec h2{margin-bottom:6px;color:#0e2c50}.week-nav{background:#fff;border:1px solid #dbe5ec;border-radius:12px;padding:18px;margin:18px 0 28px;box-shadow:0 3px 10px rgba(0,0,0,.06)}.week-nav h3{margin:0 0 14px;color:#183a5a}.week-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}.week-grid a{display:block;text-align:center;padding:10px 4px;background:#0e70b7;color:#fff;text-decoration:none;font-weight:800;border-radius:7px}.week-grid a:hover{background:#061a30}.hetek{display:flex;flex-direction:column;gap:12px}.het{position:relative;display:flex;gap:18px;align-items:flex-start;background:#fff;border:1px solid #dbe5ec;border-radius:14px;padding:18px 20px;box-shadow:0 5px 16px rgba(14,44,80,.08);scroll-margin-top:18px}.het-szam{flex:0 0 62px;width:62px;height:62px;border-radius:14px;background:linear-gradient(135deg,#0d47a1,#2196f3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:900;box-shadow:0 5px 14px rgba(25,118,210,.28)}.het-tartalom{flex:1}.het-tartalom h3{margin:0 0 7px;color:#183a5a}.het-tartalom p{margin:0;color:#617089;line-height:1.45}.gombok{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.gombok a,.gombok .hamarosan{display:inline-block;padding:9px 12px;border-radius:8px;text-decoration:none;font-weight:800;background:#eaf2f8;color:#183a5a}.gombok a:hover{background:#183a5a;color:#fff}.gombok .feladat-gomb{background:linear-gradient(135deg,#1976d2,#42a5f5);color:#fff}.gombok .gyakorlat-gomb{background:linear-gradient(135deg,#0d47a1,#1e88e5);color:#fff}.gombok .hamarosan{opacity:.45;cursor:not-allowed}.iap-kihivas{margin-top:16px;padding:15px 17px;border-radius:13px;background:linear-gradient(135deg,#e3f2fd,#f7fbff);border-left:5px solid #1976d2;color:#183a5a}.iap-kihivas strong{display:block;color:#0d47a1;margin-bottom:7px}.iap-kihivas button{margin-top:10px;border:0;border-radius:8px;padding:8px 12px;background:#1976d2;color:#fff;font-weight:800;cursor:pointer}.iap-kihivas .valasz{display:none;margin-top:10px;padding:10px 12px;border-radius:8px;background:#fff;color:#1b5e20;font-weight:700}.iap-kihivas.nyitott .valasz{display:block}footer{margin-top:36px;background:#061a30;color:white;padding:18px 40px;text-align:center}@media(max-width:900px){.week-grid{grid-template-columns:repeat(6,1fr)}}@media(max-width:650px){header,nav{padding-left:20px;padding-right:20px}.week-grid{grid-template-columns:repeat(4,1fr)}.het{gap:12px;padding:15px}.het-szam{flex-basis:52px;width:52px;height:52px;font-size:1rem}.gombok a,.gombok .hamarosan{width:100%;text-align:center}}</style></head><body><header><h1>Villamos berendezések</h1><p>IAP – Integrált Automatika Program • Felnőtt oktatás • Digitális oktatás</p></header><nav><a href="index.html">Kezdőlap</a></nav><main><section class="tantargy-fejlec"><h2>Digitális oktatás – 36 hét</h2><p>Heti 1 óra • 1. tananyagegység: <b>Villamos gépek felépítése – 10 óra</b> • 1–10. hét</p></section><div class="week-nav"><h3>Válassz hetet!</h3><div class="week-grid" id="weekgrid"></div></div><section><div class="hetek" id="hetek"></div></section></main><footer>© IAP – Integrált Automatika Program • Tanulj! Alkalmazz! Alkoss!</footer><script>
const topics={1:'A villamos gépek szerepe, fő csoportjai és alapvető szerkezeti részei',2:'Állórész és forgórész felépítése, feladata',3:'Mágneses kör, vasmag, légrés, tekercselések',4:'Egyenáramú gépek szerkezeti felépítése',5:'Aszinkron gépek felépítése: kalickás és csúszógyűrűs forgórész',6:'Szinkron gépek felépítése és gerjesztése',7:'Transzformátor mint álló villamos gép: vasmag és tekercselések',8:'Villamos gépek hűtése, szigetelése, csapágyazása és mechanikai részei',9:'Adattábla, gépazonosítás és szerkezeti kialakítás felismerése dokumentáció alapján',10:'Összefoglalás: villamos gépek szerkezeti összehasonlítása és gyakorlati felismerése'};
const challenges={1:['Egy műhelyben találsz egy ismeretlen villamos motort. Burkolatbontás nélkül nevezz meg legalább öt kívülről megfigyelhető szerkezeti elemet vagy jellemzőt, és írd le, milyen következtetést lehet levonni belőlük.','Például: tengelyvég – mechanikai teljesítményátadás; kapocsdoboz – villamos csatlakozás; bordázott gépház – hőleadás; ventilátorburkolat – kényszerhűtés; adattábla – névleges adatok.'],2:['Egy metszeti motorábrán jelöld be a sztátort, rotort, légrést, tengelyt és csapágyakat. Írd mellé, melyik rész áll, melyik forog, és hol történik az energiaátadás.','A sztátor áll, a rotor és a tengely forog. A légrésben a mágneses tér kapcsolja össze a két részt; a csapágyak a pontos, kis súrlódású forgást biztosítják.'],3:['Egy forgógép metszeti ábráján jelöld be a vasmagot, a légrést, a tekercselést és rajzold be a mágneses fluxus feltételezett útját. Miért baj, ha a légrés túl nagy?','A vasmag vezeti a fluxust, a tekercselés hozza létre a mágneses teret, a légrés pedig a sztátor és rotor közötti mágneses kapcsolat helye. Túl nagy légrésnél nagyobb gerjesztés kell, romlik a gép hatásfoka és nyomatéka.'],4:['Egy régi egyenáramú motornál erős kefeszikrázást látsz. Sorolj fel legalább négy lehetséges okot, és írd le, mit ellenőriznél először!','Lehetséges ok: kopott kefe, rossz rugónyomás, szennyezett vagy egyenetlen kommutátor, túlterhelés, rossz csatlakozás, tekercselési hiba. Először feszültségmentesítés után a kefe állapotát és a kommutátor felületét ellenőrizném.']};
const grid=document.getElementById('weekgrid');for(let i=1;i<=36;i++){const a=document.createElement('a');a.href='#het'+i;a.textContent=i+'. hét';grid.appendChild(a)}const holder=document.getElementById('hetek');for(let i=1;i<=36;i++){const d=document.createElement('div');d.className='het';d.id='het'+i;const num=String(i).padStart(2,'0'),title=topics[i]||'Tartalom később kerül feltöltésre.',desc=i<=10?'Tananyagegység: Villamos gépek felépítése • digitális oktatás • 1 óra':'A következő tananyagegység tartalma később kerül feltöltésre.';let buttons='<span class="hamarosan">📖 Tananyag</span><span class="hamarosan">📊 Bemutató</span><span class="hamarosan">✓ Feladat</span><span class="hamarosan">🧪 Gyakorlat</span>';if(i<=4){const n=String(i).padStart(2,'0');buttons='<a href="https://zsfazekas65-stack.github.io/IAP/tananyagok/villamosberendezesek_felnott/'+n+'_het.pdf" target="_blank">📖 Tananyag</a><a href="https://zsfazekas65-stack.github.io/IAP/ppt/villamosberendezesek_felnott/'+n+'_het.pptx">📊 Bemutató</a><a class="feladat-gomb" href="https://zsfazekas65-stack.github.io/IAP/feladatok/villamosberendezesek_felnott/'+n+'_het_feladat.pdf" target="_blank">✓ Feladat</a><a class="gyakorlat-gomb" href="https://zsfazekas65-stack.github.io/IAP/gyakorlatok/villamosberendezesek_felnott/'+n+'_het_gyakorlat.pdf" target="_blank">🧪 Gyakorlat</a>'}let challenge='';if(challenges[i])challenge='<div class="iap-kihivas"><strong>⚡ IAP heti kihívás</strong>'+challenges[i][0]+'<br><button type="button" onclick="toggleValasz(this)">Megoldás mutatása</button><div class="valasz">'+challenges[i][1]+'</div></div>';d.innerHTML='<div class="het-szam">'+num+'</div><div class="het-tartalom"><h3>'+i+'. hét – '+title+'</h3><p>'+desc+'</p><div class="gombok">'+buttons+'</div>'+challenge+'</div>';holder.appendChild(d)}function toggleValasz(btn){const box=btn.parentElement;box.classList.toggle('nyitott');btn.textContent=box.classList.contains('nyitott')?'Válasz elrejtése':'Megoldás mutatása';}</script><script src="iap-felnott-aktualis-het.js?v=1"></script></body></html>
