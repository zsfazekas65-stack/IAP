<!DOCTYPE html><html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLC 5. hét – Nyomozó | IAP</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#edf3f8;color:#172433}header{background:linear-gradient(135deg,#082b60,#0d47a1 55%,#6a1b9a);color:#fff;padding:30px 16px;text-align:center}header h1{margin:0 0 7px}main{max-width:850px;margin:22px auto;padding:0 15px 45px}.back{display:inline-block;background:#0d47a1;color:#fff;text-decoration:none;padding:10px 15px;border-radius:999px;font-weight:800;margin-bottom:16px}.panel{background:#fff;border-radius:18px;box-shadow:0 8px 25px #17324c20;overflow:hidden}.top{padding:15px 20px;background:#e8f1ff;color:#0d47a1;font-weight:900}.body{padding:22px}.bubble{padding:16px 18px;border-radius:15px;margin:12px 0;line-height:1.55}.detective{background:#e8f1ff;border-left:5px solid #1976d2}.measure{background:#fff8e1;border-left:5px solid #f9a825}.feedback{background:#f3e5f5;border-left:5px solid #7b1fa2}.success{background:#e8f5e9;border-left:5px solid #2e7d32}.q{font-size:1.12rem;font-weight:800;margin:18px 0 12px}.choices{display:grid;gap:10px}.choices button,.next,.restart{border:0;border-radius:11px;padding:13px 15px;font-weight:800;cursor:pointer;text-align:left;font-size:.96rem}.choices button{background:#f1f5f9;color:#17324c;border:2px solid #d8e2ec}.choices button:hover{border-color:#7b1fa2;background:#faf5ff}.next,.restart{background:#7b1fa2;color:#fff;text-align:center;margin-top:15px}.progress{height:8px;background:#dce6ef}.bar{height:100%;background:#7b1fa2;transition:.3s}.casepick{display:grid;gap:10px}.casepick button{padding:14px;border:0;border-radius:12px;background:#eef4fb;color:#0d47a1;font-weight:900;cursor:pointer;text-align:left}footer{text-align:center;background:#102a43;color:#fff;padding:18px}@media(max-width:600px){.body{padding:16px}}
</style></head><body>
<header><h1>🕵️ PLC nyomozó</h1><p>12. évfolyam • 5. hét • Ne találgass – nyomozz!</p></header>
<main><a class="back" href="../plc.html#blokk1">← Vissza a PLC 5. hetéhez</a><section class="panel"><div class="progress"><div class="bar" id="bar"></div></div><div class="top" id="title">PLC nyomozó</div><div class="body" id="game"></div></section></main>
<footer>IAP – Integrált Automatika Program • Tanulj! Alkalmazz! Alkoss!</footer>
<script>
const cases=[
{title:"1. eset – Az érzékelő lát, a PLC nem",steps:[
{t:"A gép eddig hibátlanul működött. Az induktív érzékelő LED-je felvillan, amikor a fémdarab elé kerül. A PLC bemeneti LED-je viszont sötét marad.",m:"Mérés: barna vezeték = +24 V, kék = 0 V, fekete vezetéken érzékeléskor megjelenik a jel.",q:"Az érzékelő tehát működik. Mi az első gyanúd?",a:[["Programhiba","🤔 Biztos? A PLC bemeneti LED-je sem világít. Ha a jel még a PLC-be sem jut be, a program egyelőre ártatlannak tűnik.",0],["A bemenet közös pontja / polaritása","Jó nyomon jársz. Nézzük meg a PLC bemeneti közös pontját.",1],["Az érzékelő rossz","Az érzékelő saját LED-je és a fekete vezetéken mért jel ezt nem támasztja alá. Keressük a hibát közelebb a PLC-hez.",0]]},
{t:"Megnézed a bekötést. Kiderül, hogy az érzékelő NPN típusú.",m:"A PLC bemeneti közös pontja 0 V-ra van kötve.",q:"Mi a gond?",a:[["Semmi, ez így jó","Ez a csapda. Gondold végig: az NPN melyik potenciál felé kapcsol?",0],["Az NPN negatívra kapcsol, ezért ehhez a bemeneti bekötéshez nem illeszkedik","🎯 Megvan. Az NPN kimenet a 0 V felé kapcsol; a PLC bemeneti közös pontját/bekötését ehhez kell illeszteni.",2],["A +24 V-os táp túl kicsi","A 24 V itt megfelelő. Nem a feszültség nagysága a nyom.",0]]}
],lesson:"NPN: negatív felé kapcsol. PNP: pozitív felé kapcsol. Hibakereséskor mindig együtt vizsgáld az érzékelő típusát és a PLC bemeneti közös pontját."},
{title:"2. eset – A motor, amelyik nem akar leállni",steps:[
{t:"A kezelő STOP-ot nyom. A program szerint Q1 = 0, a PLC Q1 LED-je kialszik, de a motor tovább forog.",m:"A PLC tehát logikailag kikapcsolta a kimenetet.",q:"Hol keresnéd először a hibát?",a:[["Átírom a PLC-programot","A program már 0-ra állította Q1-et. Előbb nézzük meg, hogy a valós kimenet követte-e.",0],["Megmérem a fizikai kimenetet / kontaktort","Pontosan. A logikai állapot után a fizikai áramutat kell követni.",1],["Kicserélem a STOP gombot","A PLC már érzékelte a leállítási parancsot, ezért most nem ez a legerősebb gyanú.",0]]},
{t:"Méréskor azt találod, hogy a relés PLC-kimenet kapcsain a kontaktus kikapcsolt állapotban is zárt marad.",m:"A PLC LED-je sötét, de az érintkező továbbra is vezet.",q:"Mi történt?",a:[["Összeragadt a relékimenet érintkezője","🎯 Igen. A logikai 0 nem tudta fizikailag megszakítani az áramkört.",2],["A bemenet túl gyors","Ez most a kimeneti oldalon lévő fizikai hiba.",0],["NPN/PNP probléma","Az NPN/PNP a bemeneti érzékelőknél lenne nyom. Itt relékimenetet vizsgálunk.",0]]}
],lesson:"A PLC kimeneti LED-je nem bizonyítja a terepi áramkör állapotát. A hibakereséshez mérni kell a fizikai kimenetet is."},
{title:"3. eset – A megszakadt STOP vezeték",steps:[
{t:"Egy gépen a STOP nyomógomb NO érintkezővel van bekötve. A gép működés közben rendben leáll, ha megnyomod.",m:"Egy nap azonban elszakad a STOP egyik vezetéke.",q:"Mi a veszély?",a:[["Semmi, a PLC majd észreveszi","Ha az NO kör eleve nyitott, a vezetékszakadás ugyanolyan állapotnak látszhat, mint a normál helyzet.",0],["A STOP megnyomása sem tud jelet adni","🎯 Így van. A szakadás rejtve maradhat, és a STOP működésképtelenné válik.",1],["A motor gyorsabban forog","A vezetékszakadás nem ettől változtatná a motor fordulatszámát.",0]]},
{t:"Újratervezed a STOP jelét.",m:"A cél: a vezetékszakadás is jelvesztést okozzon.",q:"Melyik érintkezési elv célszerű?",a:[["NC – nyugalomban zárt","🎯 Igen. Normál állapotban folytonos a kör; STOP vagy szakadás esetén megszűnik a jel.",2],["NO – nyugalomban nyitott","Pont ezt a hibát szeretnénk elkerülni.",0],["Mindegy","Hibafelismerés szempontjából nagyon nem mindegy.",0]]}
],lesson:"A STOP funkciónál az NC elv segít a vezetékszakadás felismerésében. Biztonsági funkcióknál mindig az adott gép előírt biztonsági megoldása az irányadó."},
{title:"4. eset – A villogó érzékelő",steps:[
{t:"Egy gyorsan mozgó alkatrész előtt az érzékelő LED-je egy pillanatra felvillan. A PLC online nézetében az I1 viszont végig 0 marad.",m:"A kábelezés jó, az érzékelő kimenetén oszcilloszkóppal rövid impulzus látható.",q:"Hová tűnhet a jel?",a:[["A PLC bemeneti szűrője kiszűri","Jó nyom. Nézzük meg az impulzus idejét.",1],["Biztosan rossz az érzékelő","Az oszcilloszkóp szerint valódi kimeneti impulzust ad.",0],["A motor reléje összeragadt","Ez egy bemeneti jelenség; a motorrelé nem magyarázza az eltűnő I1 jelet.",0]]},
{t:"Az impulzus 2 ms hosszú.",m:"A PLC bemeneti szűrésének beállított ideje 10 ms.",q:"Mi a következtetés?",a:[["A 2 ms-os jel túl rövid, a PLC kiszűri","🎯 Pontosan. A jel fizikailag létezik, de a bemeneti szűrő miatt nem jut el logikai eseményként a programhoz.",2],["A PLC túl gyors","Éppen ellenkezőleg: a beállított szűrés hosszabb a jel időtartamánál.",0],["24 V helyett 230 V kell","Nem. PLC digitális bemenetnél ez veszélyes és hibás következtetés lenne.",0]]}
],lesson:"Gyors jeleknél nemcsak a feszültségszint, hanem az impulzus időtartama és a bemeneti szűrés is számít."},
{title:"5. eset – Világít a START, mégsem indul",steps:[
{t:"Megnyomod a START gombot. A PLC egyik bemeneti LED-je világít, de a programban a START kontaktus nem vált át.",m:"A terepi jel tehát eljutott valamelyik PLC-bemenetre.",q:"Mit ellenőrzöl először?",a:[["A fizikai bemenet és a program címe egyezik-e","🎯 Ez a legerősebb első ellenőrzés.",1],["A motor csapágyát","Még a program START feltétele sem változik, ezért előbb maradjunk a jel útján.",0],["A hálózati 230 V frekvenciáját","Ez nem magyarázza, hogy a program miért nem látja a START jelet.",0]]},
{t:"A nyomógomb fizikailag I2-re van kötve.",m:"A programban a START érintkező címe I1.",q:"Mi a hiba?",a:[["Címzési hiba","🎯 Megvan. A hardver I2-t kapcsol, a program viszont I1-et figyel.",2],["Rossz a PLC tápegysége","A PLC működik és I2 LED-je jelez; a nyom a címzés.",0],["Összeragadt a kimenet","Még a START feltételnél járunk, nem a kimenetnél.",0]]}
],lesson:"Mindig kövesd végig a jel útját: érzékelő/nyomógomb → fizikai kapocs → PLC-cím → programfeltétel."},
{title:"6. eset – A vészgomb, ami csak a programnak szól",steps:[
{t:"A vészleállító egy normál PLC-bemenetre van kötve. A programban egy kontaktus lekapcsolja Q1-et.",m:"Próbán működik: megnyomod, a motor leáll.",q:"Kijelenthetjük, hogy ezzel kész a biztonsági funkció?",a:[["Igen, mert a próba sikerült","A próba csak azt mutatja, hogy normál működésben reagál. Mi történik egy PLC-, program- vagy kimeneti hiba esetén?",0],["Nem, a biztonsági funkcióhoz megfelelő, erre tervezett biztonsági megoldás kell","🎯 Ez a helyes irány.",1],["Igen, ha Q1 LED kialszik","A LED nem bizonyítja sem a fizikai lekapcsolást, sem a biztonsági funkció megfelelőségét.",0]]},
{t:"Tegyük fel, hogy a normál PLC relékimenetének érintkezője összeragad.",m:"A program Q1=0-t ír, de a fizikai érintkező zárt marad.",q:"Mit bizonyít ez az eset?",a:[["A biztonságot nem szabad kizárólag a normál PLC-programra bízni","🎯 Pontosan. A biztonsági funkciót a kockázatnak és az előírásoknak megfelelő biztonsági rendszerrel kell megvalósítani.",2],["A STOP gomb legyen NO","Nem. Ez nem oldaná meg a biztonsági vezérlés alapvető problémáját.",0],["Az NPN jobb, mint a PNP","Ez teljesen más kérdéskör.",0]]}
],lesson:"A vészleállítás biztonsági funkció. Nem egyszerű PLC-programozási feladat; a gép kockázatértékelésének és vonatkozó biztonsági követelményeinek megfelelő kialakítás szükséges."}
];
let ci=-1,si=0;
const game=document.getElementById("game"),title=document.getElementById("title"),bar=document.getElementById("bar");
function menu(){ci=-1;bar.style.width="0";title.textContent="🕵️ Válassz egy ügyet";game.innerHTML='<div class="bubble detective"><b>Nyomozó:</b> Ma te vagy a hibakereső. Nem adom oda előre a megoldást. Minden döntésed után kapsz egy új nyomot.</div><div class="casepick">'+cases.map((c,i)=>'<button onclick="start('+i+')">🔎 '+c.title+'</button>').join("")+'</div>'}
function start(i){ci=i;si=0;render()}
function render(){let c=cases[ci],s=c.steps[si];title.textContent="🔎 "+c.title;bar.style.width=((si+1)/(c.steps.length+1)*100)+"%";game.innerHTML='<div class="bubble detective"><b>Nyomozó:</b> '+s.t+'</div>'+(s.m?'<div class="bubble measure"><b>📟 Nyom:</b> '+s.m+'</div>':'')+'<div class="q">👉 '+s.q+'</div><div class="choices">'+s.a.map((x,i)=>'<button onclick="choose('+i+')">'+x[0]+'</button>').join("")+'</div><div id="fb"></div>'}
function choose(i){let c=cases[ci],s=c.steps[si],a=s.a[i],fb=document.getElementById("fb");if(a[2]===0){fb.innerHTML='<div class="bubble feedback"><b>🤔 Nyomozó:</b> '+a[1]+'</div>';return}if(a[2]===1){fb.innerHTML='<div class="bubble success"><b>👍 Nyomozó:</b> '+a[1]+'</div><button class="next" onclick="nextStep()">Kérem a következő nyomot →</button>';return}fb.innerHTML='<div class="bubble success"><b>🎯 Megoldottad:</b> '+a[1]+'<br><br><b>🎓 Tanulság:</b> '+c.lesson+'</div><button class="next" onclick="menu()">← Új ügyet választok</button>'}
function nextStep(){si++;render()} menu();
</script></body></html>
