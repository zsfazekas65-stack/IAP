<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#031a33">
<title>IAP – Belépés</title>
<style>
:root{--cyan:#26bfff;--blue:#075fc7;--green:#049a78;--navy:#021a33}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--navy);color:#fff}
.page{position:relative;min-height:100vh;min-height:100dvh}
.school,.shade{position:absolute;inset:0;pointer-events:none}
.school{background:url('https://dunaujvarosi.cms.szc.edir.hu/uploads/DSC_0047_2_172573292e.jpg') center 46%/cover no-repeat}
.shade{background:linear-gradient(0deg,rgba(1,14,29,.93),rgba(1,19,38,.48) 45%,rgba(2,23,44,.12))}
.wrap{position:relative;z-index:1;max-width:1440px;margin:auto;min-height:100vh;min-height:100dvh;padding:28px 34px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.brandtext strong{display:block;font-size:clamp(22px,2.3vw,36px);line-height:1.15;text-shadow:0 2px 10px #001a33}
.brandtext strong b{font-size:1.05em}
.script{font-family:'Segoe Script',cursive;font-size:26px;text-align:right;transform:rotate(-5deg);text-shadow:0 2px 10px #001}
.main{display:flex;flex:1;align-items:center;justify-content:center;padding:40px 0 24px}
.layout{display:grid;grid-template-columns:280px minmax(0,640px);gap:32px;align-items:center;width:100%;max-width:952px}
.menu{background:rgba(2,22,43,.7);border:1px solid #4bbeff66;border-radius:14px;backdrop-filter:blur(5px);overflow:hidden}
.menu>div:not(.side-info){padding:10px 16px;border-bottom:1px solid #5ac0ff33;font-size:14px;letter-spacing:.04em;text-align:center}
.side-info{display:flex;flex-direction:column;gap:10px;padding:14px}
.school-link,.iap-datetime{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;padding:10px;border:1px solid #48caff99;border-radius:12px;background:linear-gradient(135deg,#072748ee,#031831ee);color:#eefaff;text-align:center;text-transform:uppercase;font-size:12px;font-weight:700;text-decoration:none;line-height:1.35}
.iap-datetime{flex-direction:column;gap:3px}.iap-datetime .time{font-size:17px;color:#7edcff}
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;width:100%}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:200px;padding:20px 12px;border-radius:18px;color:#fff;text-align:center;text-decoration:none;box-shadow:0 12px 28px #0005;transition:filter .2s}
.student{background:linear-gradient(145deg,#0868d6f7,#02255cf5);border:2px solid #27b8ff}.teacher{background:linear-gradient(145deg,#04a37ef2,#004448f7);border:2px solid #21e2c2}
.card:hover{filter:brightness(1.1)}.icon{font-size:46px}.card strong{font-size:30px;margin:7px 0}.card small{font-size:10px;line-height:1.4;letter-spacing:.03em;color:#cdeaff}
.arrow{display:grid;place-items:center;width:36px;height:36px;margin-top:12px;border:2px solid #dff7ff;border-radius:50%;font-size:24px}
.card:focus-visible,.school-link:focus-visible{outline:3px solid #fff;outline-offset:4px}
@media(max-width:1280px),(pointer:coarse) and (max-width:1600px){
 .wrap{padding:18px 22px}.brandtext strong{font-size:24px}.script{display:none}
 .main{padding:24px 0 16px}.layout{display:flex;flex-direction:column;gap:18px;max-width:660px}
 .menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}
 .menu>div:not(.side-info){font-size:11px;padding:9px 6px}
 .side-info{grid-column:1/-1;flex-direction:row;padding:10px;gap:10px}
 .school-link,.iap-datetime{flex:1;min-width:0;min-height:48px;font-size:11px;padding:7px}
 .iap-datetime .date{font-size:10px}.iap-datetime .time{font-size:15px}
 .choice{max-width:560px;gap:16px}.card{min-height:154px;padding:14px 10px}
 .icon{font-size:34px}.card strong{font-size:24px;margin:4px 0}.card small{font-size:9px}
 .arrow{width:30px;height:30px;font-size:20px;margin-top:8px}
}
@media(max-width:600px){
 .wrap{padding:16px}.brandtext strong{font-size:19px}.main{padding:24px 0}.layout{gap:14px}
 .menu>div:not(.side-info){font-size:10px;padding:9px 4px}.side-info{padding:8px;gap:8px}
 .school-link{font-size:10px}.iap-datetime .date{font-size:9px}
 .choice{gap:10px}.card{min-height:148px;padding:12px 8px}.card strong{font-size:22px}.card small{font-size:8px}
}
@media(max-width:360px){.choice{grid-template-columns:1fr}.card{min-height:136px}.brandtext strong{font-size:17px}}

</style>
</head>
<body class="iap-compact iap-entry">
<main class="page">
  <div class="school" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>


  <div class="wrap">
    <header class="top">
      <div class="brand"><div class="brandtext"><strong>Dunaújvárosi Szakképzési Centrum<br><b>Dunaferr Technikum és Szakképző Iskola</b></strong></div></div>
      <div class="script">Együtt<br>a jövő szakembereiért!</div>
    </header>
    <section class="main">
      <div class="layout">
        <div class="menu"><div>ELEKTRONIKA</div><div>INFORMATIKA</div><div>GÉPÉSZET</div><div>AUTOMATIZÁLÁS</div><div>SZAKMAI SIKER</div><div>BIZTOS JÖVŐ</div><div class="side-info">
  <a class="school-link" href="https://www.dunaferriskola.hu/" target="_blank" rel="noopener noreferrer" title="A Dunaferr Iskola hivatalos honlapja">🏫 ISKOLA HONLAPJA ↗</a>
  <div class="iap-datetime" aria-label="Aktuális dátum és idő">
    <div class="date" id="iapCurrentDate">Dátum betöltése…</div>
    <div class="time" id="iapCurrentTime">--:--</div>
  </div>
</div></div>
        <div class="choice">
          <a class="card student" href="tanulo.html"><span class="icon">🎓</span><strong>TANULÓ</strong><small>BELÉPÉS A TANULÓI FELÜLETRE</small><span class="arrow">›</span></a>
          <a class="card teacher" id="teacherEntry" href="oktato.html"><span class="icon">👨‍🏫</span><strong>OKTATÓ</strong><small>TANÁRI PIN-KÓD SZÜKSÉGES</small><span class="arrow">›</span></a>
        </div>
      </div>
    </section>
  </div>
</main>
<script>

function iapClock(){
  const now = new Date();
  const date = new Intl.DateTimeFormat('hu-HU',{
    year:'numeric', month:'long', day:'numeric', weekday:'long'
  }).format(now);
  const time = new Intl.DateTimeFormat('hu-HU',{
    hour:'2-digit', minute:'2-digit', hour12:false
  }).format(now);
  const d = document.getElementById('iapCurrentDate');
  const t = document.getElementById('iapCurrentTime');
  if(d) d.textContent = date.toUpperCase();
  if(t) t.textContent = time;
}
iapClock();
setInterval(iapClock,1000);

const IAP_TEACHER_PIN_HASH='353644551c422cfbda087f398820d35d6ff3a997ac53ba7f549cc6483b58a3ef';
const fromEszkoztar=document.referrer&&new URL(document.referrer).pathname.endsWith('/eszkoztar.html');
if(fromEszkoztar&&sessionStorage.getItem('iapTeacherAuth')==='1'){window.location.assign('oktato.html');}
async function sha256(text){const data=new TextEncoder().encode(text);const hash=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');}
async function teacherLogin(){
  if(sessionStorage.getItem('iapTeacherAuth')==='1'){window.location.assign('oktato.html');return;}
  const pin=prompt('Tanári PIN-kód:');
  if(pin===null)return;
  if(await sha256(pin.trim())===IAP_TEACHER_PIN_HASH){sessionStorage.setItem('iapTeacherAuth','1');window.location.assign('oktato.html');}
  else alert('Hibás PIN-kód.');
}
document.getElementById('teacherEntry').addEventListener('click',function(e){e.preventDefault();teacherLogin();});
if(new URLSearchParams(location.search).get('oktato')==='1')teacherLogin();
</script>
</body>
</html>
