<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IAP – Belépés</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#04192d;color:#fff}body{min-height:100vh}.page{min-height:100vh;position:relative;display:flex;flex-direction:column;justify-content:flex-end;background-image:linear-gradient(to bottom,rgba(2,17,32,.05) 35%,rgba(2,17,32,.72) 78%,rgba(2,17,32,.92) 100%),url('./iap_role_final.png');background-position:center;background-size:cover;background-repeat:no-repeat}.entry{position:relative;z-index:2;width:min(900px,92vw);margin:0 auto 5vh;text-align:center}.entry h1{margin:0 0 18px;font-size:clamp(24px,3vw,40px);text-shadow:0 3px 14px #000}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:20px}.btn{min-height:105px;border:1px solid rgba(255,255,255,.35);border-radius:18px;display:flex;align-items:center;justify-content:center;gap:14px;text-decoration:none;color:white;font-size:clamp(21px,2.4vw,30px);font-weight:900;letter-spacing:.04em;box-shadow:0 14px 35px rgba(0,0,0,.35);transition:.2s}.btn:hover{transform:translateY(-4px);filter:brightness(1.08)}.student{background:linear-gradient(135deg,rgba(0,119,190,.96),rgba(20,190,242,.94))}.teacher{background:linear-gradient(135deg,rgba(12,42,70,.97),rgba(37,91,132,.96))}.icon{font-size:38px}@media(max-width:650px){.page{background-position:center top}.entry{margin-bottom:24px}.buttons{grid-template-columns:1fr;gap:12px}.btn{min-height:82px}}
</style>
</head>
<body>
<main class="page">
<section class="entry" aria-label="IAP belépés">
<h1>Válaszd ki a felületet!</h1>
<div class="buttons">
<a class="btn student" href="tanulo.html"><span class="icon">🎓</span><span>TANULÓ</span></a>
<a class="btn teacher" href="oktato.html"><span class="icon">👨‍🏫</span><span>OKTATÓ</span></a>
</div>
</section>
</main>
</body>
</html>
