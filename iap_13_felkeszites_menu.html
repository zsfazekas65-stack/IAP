6 hét';document.querySelector('#search').value='';render()}function render(){const q=document.querySelector('#search').value.toLocaleLowerCase('hu');document.querySelector('#weeks').innerHTML=DATA[active].map((r,i)=>{let week=i+1,topic=r[1]||'',a=r[2]||'',b=r[3]||'',result=r[r.length-1]||'';if(![String(week),topic,a,b,result].join(' ').toLocaleLowerCase('hu').includes(q))return '';return `<article class="week"><h3>${week}. hét</h3><div class="topic">${esc(topic)}</div><div class="lesson"><strong>${active==='verseny'?'1. óra':'Felkészítés'}:</strong> ${esc(a)}</div>${active==='verseny'?`<div class="lesson"><strong>2. óra:</strong> ${esc(b)}</div>`:''}<div class="lesson"><strong>Elvárt eredmény:</strong> ${esc(result)}</div><div class="actions">${['Tananyag','Feladat','Gyakorlat','Teszt'].map(n=>`<button onclick="missing(${week},'${n}')">${n} · készül</button>`).join('')}</div></article>`}).join('')||'<p>Nincs találat.</p>'}function missing(week,kind){document.querySelector('#dialogtext').textContent=`${labels[active]} – ${week}. hét – ${kind}. A tartalom még nincs feltöltve; ez a menüpont elő van készítve.`;document.querySelector('#modal').classList.add('open')}function closeModal(){document.querySelector('#modal').classList.remove('open')}show(new URLSearchParams(location.search).get('tantargy')==='vizsga'?'vizsga':'verseny');</script></body></html>
